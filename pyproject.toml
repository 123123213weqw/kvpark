[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-tier-lab"
version = "0.2.0"
description = "Measured, bounded RAM/disk KV snapshot storage for consumer CUDA GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
demo = ["transformers>=4.51,<6", "safetensors>=0.4"]

[project.scripts]
kv-tier-bench = "kv_tier.benchmark:main"
kv-tier-plan = "kv_tier.planner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: requires an NVIDIA CUDA device", "linux: requires Linux O_DIRECT"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
